<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — FlameGrill</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
  <a href="/" class="logo">🔥Flame<span>Grill</span></a>
  <ul class="nav-links">
    <li><a href="/">Accueil</a></li>
    <li><a href="/menu">Menu</a></li>
  </ul>
  <a href="/cart" class="cart-btn">🛒 Panier <span class="cart-count">0</span></a>
</nav>

<div class="section-title">
  <h2>Notre <span>Menu</span></h2>
  <p>Choisissez parmi nos délicieux plats</p>
</div>

<section class="menu-section">
  <div class="category-tabs">
    <button class="tab-btn active" data-cat="all">🍽️ Tout</button>
    {% for cat in categories %}
    <button class="tab-btn" data-cat="{{ cat }}">
      {% if cat == 'Burgers' %}🍔
      {% elif cat == 'Chicken' %}🍗
      {% elif cat == 'Sides' %}🍟
      {% elif cat == 'Drinks' %}🥤
      {% elif cat == 'Desserts' %}🍨
      {% endif %}
      {{ cat }}
    </button>
    {% endfor %}
  </div>

  <div class="menu-grid">
    {% for item in menu %}
    <div class="menu-card" data-category="{{ item.category }}">
      <div class="food-emoji">{{ item.emoji }}</div>
      <h3>{{ item.name }}</h3>
      <p class="desc">{{ item.desc }}</p>
      <div class="price">{{ item.price }} DA</div>
      <button class="add-btn" data-id="{{ item.id }}">🛒 Ajouter</button>
    </div>
    {% endfor %}
  </div>
</section>

<footer>
  <p>© 2024 <span>FlameGrill</span> — Fast Food Algérien</p>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
